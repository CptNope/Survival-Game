name: Survival Game Checks

on:
  pull_request:
    paths:
      - 'js/**'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/checks.yml'
  push:
    branches: [main]
    paths:
      - 'js/**'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/checks.yml'

permissions:
  contents: read

concurrency:
  group: survival-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run focused regression suite
        run: npm test
